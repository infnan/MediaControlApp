plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mediatoggle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.mediatoggle'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
